<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test Acuité Visuelle (Optométrique)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: Arial, sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        video {
            position: absolute;
            width: 1px; height: 1px; opacity: 0; pointer-events: none;
        }
        canvas { display: none; }

        #letterDisplay {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: white;
            font-family: Arial, sans-serif; /* Police standard proche des optotypes */
            opacity: 0;
            z-index: 50;
            pointer-events: none;
            line-height: 1;
        }

        #toggleButton {
            position: fixed; top: 10px; left: 10px;
            width: 50px; height: 50px;
            background: rgba(78, 205, 196, 0.9);
            border: none; border-radius: 50%;
            cursor: pointer; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(78, 205, 196, 0.4);
        }

        #controlPanel {
            position: fixed; top: 70px; left: 10px;
            background: rgba(0, 0, 0, 0.98);
            color: #4ecdc4; padding: 20px;
            border-radius: 12px; font-size: 12px; z-index: 100;
            width: 300px; max-height: 80vh; overflow-y: auto;
            border: 2px solid #4ecdc4;
            transform: translateX(-400px);
            transition: transform 0.3s ease;
        }
        #controlPanel.show { transform: translateX(0); }

        h3 { color: #4ecdc4; margin-bottom: 15px; font-size: 14px; border-bottom: 2px solid #4ecdc4; padding-bottom: 8px; }
        h4 { color: #00ff00; margin-top: 15px; margin-bottom: 10px; font-size: 12px; }
        .control-group { margin: 12px 0; padding: 10px; background: rgba(78, 205, 196, 0.1); border-left: 3px solid #4ecdc4; border-radius: 4px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 11px; color: #fff; }
        input[type="range"] { width: 100%; height: 5px; cursor: pointer; margin-top: 5px; accent-color: #4ecdc4; }
        .info-text { color: #888; font-size: 10px; display: block; margin-top: 2px; }

        .stat-line {
            margin: 6px 0; padding: 6px 8px;
            background: rgba(0, 255, 0, 0.05); border-radius: 3px;
            font-family: 'Courier New', monospace; color: #00ff00;
            font-size: 10px; word-break: break-all; height: 16px; line-height: 16px;
        }
        .stat-line.error { color: #ff6666; background: rgba(255, 100, 100, 0.1); }
        .stat-line.success { color: #66ff66; background: rgba(100, 255, 100, 0.1); }
        .stat-line.trigger { color: #ffff00; background: rgba(255, 255, 0, 0.2); }

        #status {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95); color: #4ecdc4;
            padding: 40px 60px; border-radius: 15px;
            font-size: 18px; z-index: 200; text-align: center;
            border: 2px solid #4ecdc4;
        }
        .dot { animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.3; } }
    </style>
</head>
<body>
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div id="letterDisplay"></div>

    <button id="toggleButton">⚙️</button>

    <div id="controlPanel">
        <h3>⚙️ Paramètres</h3>

        <div class="control-group">
            <label>Acuité (1/10e): <strong id="sizeVal">1.0</strong></label>
            <input type="range" id="letterSize" min="0.1" max="10" value="1.0" step="0.1">
            <span class="info-text">1.0 = 10/10ème | 0.1 = 1/10ème</span>
        </div>

        <div class="control-group">
            <label>Pixels par pouce (DPI): <strong id="dpiVal">Auto</strong></label>
            <input type="range" id="dpiInput" min="150" max="600" value="300" step="10">
            <span class="info-text" id="dpiInfo">Calibration auto active</span>
        </div>

        <div class="control-group">
            <label>Durée Affichage (ms): <strong id="dispVal">60</strong></label>
            <input type="range" id="displayTime" min="16" max="500" value="60" step="1">
        </div>

        <div class="control-group">
            <label>Vitesse min déclenchement: <strong id="minSpeedVal">150</strong> °/s</label>
            <input type="range" id="minSpeed" min="50" max="300" value="150" step="10">
        </div>

        <div class="control-group">
            <label>Seuil Stabilité (Stop): <strong id="stabilityVal">40</strong> °/s</label>
            <input type="range" id="stopThreshold" min="10" max="100" value="40" step="5">
        </div>

         <div class="control-group">
            <label>Délai (ms): <strong id="cooldownVal">1000</strong></label>
            <input type="range" id="cooldown" min="200" max="5000" value="1000" step="100">
        </div>

        <h4>📊 Stats en direct</h4>
        <div class="stat-line" id="statDetection">Visage: --</div>
        <div class="stat-line" id="statDistance">Distance: -- cm</div>
        <div class="stat-line" id="statAngularSpeed">Vitesse: --°/s</div>
        <div class="stat-line" id="statSize">Taille: -- px (-- mm)</div>
        <div class="stat-line" id="statLetter">Lettre: --</div>
        <div class="stat-line" id="statState">État: En attente</div>
    </div>

    <div id="status">
        <div style="font-size: 40px; margin-bottom: 15px;">📷</div>
        <div>Initialisation<span class="dot">...</span></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7"></script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const letterDisplay = document.getElementById('letterDisplay');
        const statusDiv = document.getElementById('status');
        const controlPanel = document.getElementById('controlPanel');
        const toggleButton = document.getElementById('toggleButton');
        const letters = 'CDFHPRTZLEO'; // Optotypes recommandés

        // Paramètres
        let displayTime = 60;
        let acuityDecimal = 1.0; // 1.0 = 10/10
        let screenDPI = 300; // Valeur par défaut, sera écrasée par l'auto-calibration
        let minSpeed = 150;
        let stopThreshold = 40;
        let cooldown = 1000;

        let currentDistance = 50;
        let currentLetter = '';
        let currentLetterSizePx = 0;
        let currentAngularSpeed = 0;
        let lastLetterDisplayTime = 0;

        let lastYaw = null;
        let lastPitch = null;
        let lastYawTime = 0;
        let currentYaw = 0;
        let currentPitch = 0;

        let detector = null;
        let initialized = false;
        let motionState = 'WAITING';
        let letterTimeoutId = null;

        function log(id, msg, type = 'normal') {
            const el = document.getElementById(id);
            if (el) {
                el.textContent = msg;
                el.className = 'stat-line ' + type;
            }
        }

        // --- CALIBRATION AUTOMATIQUE DPI ---
        function autoCalibrateDPI() {
            // Device Pixel Ratio (ex: 2 pour Retina, 3 pour iPhone récents)
            const dpr = window.devicePixelRatio || 1;
            let estimatedDPI;

            // Approximation basée sur le ratio et les standards du marché
            if (dpr >= 3) estimatedDPI = 460; // iPhone Pro / High-End Android
            else if (dpr >= 2) estimatedDPI = 330; // iPad / Android standard
            else if (dpr >= 1.5) estimatedDPI = 260; // Tablettes anciennes / Low-End
            else estimatedDPI = 96; // PC Bureau standard

            // Mise à jour de l'interface
            screenDPI = estimatedDPI;
            document.getElementById('dpiInput').value = screenDPI;
            document.getElementById('dpiVal').textContent = screenDPI + " (Auto)";
            document.getElementById('dpiInfo').textContent = `Ratio écran: ${dpr}x`;
            console.log("DPI Calibrés auto:", screenDPI);
        }

        toggleButton.addEventListener('click', () => {
            controlPanel.classList.toggle('show');
        });

        async function initBlazeFace() {
            try {
                await tf.ready();
                detector = await blazeface.load();
                
                // Lancer la calibration AVANT de montrer l'app
                autoCalibrateDPI();

                statusDiv.style.display = 'none';
                controlPanel.classList.add('show');
                initialized = true;
                animate();
            } catch (err) {
                statusDiv.innerHTML = `<div style="color:red">Erreur IA: ${err.message}</div>`;
            }
        }

        function calculateHeadAngles(landmarks) {
            if (!landmarks || landmarks.length < 4) return null;
            const leftEye = landmarks[0];
            const rightEye = landmarks[1];
            const nose = landmarks[2];
            const mouth = landmarks[3];

            const faceWidth = Math.sqrt(Math.pow(rightEye[0] - leftEye[0], 2) + Math.pow(rightEye[1] - leftEye[1], 2));
            const eyeCenterX = (leftEye[0] + rightEye[0]) / 2;
            
            // Yaw : rotation gauche/droite basé sur la position du nez par rapport aux yeux
            const yawAngle = ((nose[0] - eyeCenterX) / Math.max(faceWidth, 0.1)) * 90;
            
            // Pitch : rotation haut/bas
            const eyeCenterY = (leftEye[1] + rightEye[1]) / 2;
            const pitchAngle = ((mouth[1] - eyeCenterY) / Math.max(faceWidth, 0.1)) * 60;

            return { yaw: yawAngle, pitch: pitchAngle };
        }

        function calculateAngularVelocity(newYaw, newPitch, timeDelta) {
            if (lastYaw === null || timeDelta < 30) {
                lastYaw = newYaw;
                lastPitch = newPitch;
                lastYawTime = Date.now();
                return 0;
            }
            
            const speedYaw = Math.abs(newYaw - lastYaw) / (timeDelta / 1000);
            const speedPitch = Math.abs(newPitch - lastPitch) / (timeDelta / 1000);
            
            lastYaw = newYaw;
            lastPitch = newPitch;
            lastYawTime = Date.now();

            // On combine les vitesses pour avoir une vélocité globale
            return speedYaw + speedPitch;
        }

        function estimateDistance(start, end) {
            // Approximation : largeur visage ~16cm
            const pixelWidth = Math.sqrt(Math.pow(end[0] - start[0], 2) + Math.pow(end[1] - start[1], 2));
            if (pixelWidth < 10) return 200; // Sécurité
            // Formule empirique ajustée pour webcam/phone
            return (16 * 800) / pixelWidth; 
        }

        // --- NOUVEAU CALCUL OPTOMÉTRIQUE ---
        function calculateOptometricSize() {
            // 1. Angle visuel : une lettre complète fait 5 minutes d'arc pour une acuité de 1.0 (10/10)
            // Si acuité = 0.1 (1/10), la lettre doit être 10x plus grande.
            const visualAngleMinutes = 5 / acuityDecimal; 
            const visualAngleDegrees = visualAngleMinutes / 60;

            // 2. Trigonométrie : Taille = 2 * Distance * tan(angle/2)
            const distanceCm = currentDistance;
            const letterHeightCm = 2 * distanceCm * Math.tan((visualAngleDegrees * Math.PI / 180) / 2);

            // 3. Conversion cm vers Pixels écran
            const pixelsPerCm = screenDPI / 2.54;
            const letterHeightPx = letterHeightCm * pixelsPerCm;

            return { px: letterHeightPx, cm: letterHeightCm };
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: false,
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    initBlazeFace();
                };
            } catch (err) {
                statusDiv.innerHTML = `<div>Erreur Caméra</div>`;
            }
        }

        async function animate() {
            if (!initialized) { requestAnimationFrame(animate); return; }

            try {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const predictions = await detector.estimateFaces(canvas, false);

                if (predictions && predictions.length > 0) {
                    const face = predictions[0];
                    const angles = calculateHeadAngles(face.landmarks);

                    if (angles) {
                        currentDistance = estimateDistance(face.start, face.end);
                        const now = Date.now();
                        const timeDelta = now - lastYawTime;

                        if (angles) {
                            currentAngularSpeed = calculateAngularVelocity(angles.yaw, angles.pitch, timeDelta);
                        }

                        log('statDetection', '✅ Visage détecté', 'success');

                        const nowMs = Date.now();
                        const cooldownOver = nowMs - lastLetterDisplayTime > cooldown;

                        // --- MACHINE D'ÉTATS ---

                        // 1. WAITING : On attend un mouvement brusque
                        if (motionState === 'WAITING') {
                            if (currentAngularSpeed >= minSpeed && cooldownOver) {
                                // --- DÉCLENCHEMENT ---
                                
                                const sizeData = calculateOptometricSize();
                                currentLetterSizePx = sizeData.px;
                                currentLetter = letters[Math.floor(Math.random() * letters.length)];

                                // Affichage Immédiat
                                letterDisplay.textContent = currentLetter;
                                letterDisplay.style.fontSize = currentLetterSizePx + 'px';
                                letterDisplay.style.opacity = '1';

                                lastLetterDisplayTime = nowMs;
                                motionState = 'TRIGGERED';
                                
                                log('statState', '⚡ FLASH !', 'trigger');
                                log('statLetter', currentLetter);

                                // Extinction précise via Timeout
                                if (letterTimeoutId) clearTimeout(letterTimeoutId);
                                letterTimeoutId = setTimeout(() => {
                                    letterDisplay.style.opacity = '0';
                                }, displayTime);
                            }
                        } 
                        
                        // 2. TRIGGERED : La lettre est affichée (ou vient de s'éteindre)
                        // On attend que la tête s'ARRÊTE pour réarmer le système
                        else if (motionState === 'TRIGGERED') {
                            if (currentAngularSpeed < stopThreshold) {
                                motionState = 'WAITING';
                                // Reset des vars de vitesse pour éviter un pic instantané au redémarrage
                                lastYaw = null; 
                                log('statState', '⚪ Prêt', 'success');
                            }
                        }
                    }
                } else {
                    log('statDetection', '❌ Aucun visage');
                }

                // Mise à jour des stats visuelles
                document.getElementById('statDistance').textContent = `Dist: ${Math.round(currentDistance)}cm`;
                document.getElementById('statAngularSpeed').textContent = `Vit: ${Math.round(currentAngularSpeed)}°/s`;
                
                // Affichage taille en px et mm
                const currentSizeInfo = calculateOptometricSize();
                document.getElementById('statSize').textContent = `${Math.round(currentSizeInfo.px)}px (${(currentSizeInfo.cm*10).toFixed(1)}mm)`;

            } catch (e) { console.error(e); }
            
            requestAnimationFrame(animate);
        }

        // --- LISTENERS ---
        document.getElementById('letterSize').addEventListener('input', (e) => {
            acuityDecimal = parseFloat(e.target.value);
            document.getElementById('sizeVal').textContent = acuityDecimal.toFixed(1);
        });
        
        document.getElementById('dpiInput').addEventListener('input', (e) => {
            screenDPI = parseInt(e.target.value);
            document.getElementById('dpiVal').textContent = screenDPI;
            document.getElementById('dpiInfo').textContent = "Réglage manuel";
        });

        document.getElementById('displayTime').addEventListener('input', (e) => {
            displayTime = parseInt(e.target.value);
            document.getElementById('dispVal').textContent = displayTime;
        });
        document.getElementById('minSpeed').addEventListener('input', (e) => {
            minSpeed = parseInt(e.target.value);
            document.getElementById('minSpeedVal').textContent = minSpeed;
        });
        document.getElementById('stopThreshold').addEventListener('input', (e) => {
            stopThreshold = parseInt(e.target.value);
            document.getElementById('stabilityVal').textContent = stopThreshold;
        });
        document.getElementById('cooldown').addEventListener('input', (e) => {
            cooldown = parseInt(e.target.value);
            document.getElementById('cooldownVal').textContent = cooldown;
        });

        startCamera();
    </script>
</body>
</html>
