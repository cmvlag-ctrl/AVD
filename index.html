<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Test AV - Correction</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        
        /* Vidéo cachée mais active */
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.2; /* On la laisse légèrement visible pour vérifier que ça filme */
            z-index: 1;
            transform: scaleX(-1); /* Effet miroir */
        }

        /* La lettre au centre */
        #letterDisplay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            font-weight: bold;
            color: white;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px black;
        }

        /* Interface */
        #ui {
            position: absolute;
            top: 10px; left: 10px;
            z-index: 20;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 8px;
            max-width: 300px;
        }
        .stat { font-size: 12px; margin: 2px 0; color: #0f0; font-family: monospace; }
        .error { color: #f55; }
        
        button {
            background: #4ecdc4; border: none; padding: 10px;
            border-radius: 5px; cursor: pointer; font-weight: bold;
            width: 100%; margin-top: 5px;
        }

        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Écran de démarrage obligatoire pour les permissions -->
    <div id="startOverlay">
        <h1>Test Acuité</h1>
        <p>Besoin d'accès à la caméra.</p>
        <button onclick="startApp()">DÉMARRER</button>
        <p id="errorMsg" class="error"></p>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <div id="letterDisplay">A</div>

    <div id="ui" style="display:none;">
        <div class="stat" id="statusInit">Initialisation...</div>
        <div class="stat" id="statusSpeed">Vitesse: 0°/s</div>
        <div class="stat" id="statusDist">Distance: -- cm</div>
        <div class="stat" id="statusSize">Taille: -- px</div>
        <hr style="border-color:#333">
        <div style="font-size:11px; margin-top:5px;">
            Acuité: <input type="range" id="acuity" min="0.1" max="2.0" step="0.1" value="1.0" oninput="updateParams()"> <span id="valAcuity">1.0</span>
        </div>
    </div>

    <!-- Chargement des librairies -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface@0.0.7"></script>

    <script>
        let model = null;
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let letterEl = document.getElementById('letterDisplay');
        let ui = document.getElementById('ui');
        let overlay = document.getElementById('startOverlay');
        
        // Paramètres
        let acuity = 1.0; // 1.0 = 10/10ème
        let screenDPI = 300; // Valeur par défaut
        
        // Tracking
        let lastHeadPos = null;
        let lastTime = 0;
        let speed = 0;
        let distance = 50; // cm
        let state = 'IDLE'; // IDLE, FLASH, COOLDOWN
        let lastFlashTime = 0;
        const letters = "C D F H L N O P T U V Z".split(" ");

        // 1. Démarrage de l'application
        async function startApp() {
            try {
                // Demande caméra
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user', 
                        width: { ideal: 640 }, 
                        height: { ideal: 480 } 
                    }
                });
                
                video.srcObject = stream;
                
                // Attendre que la vidéo soit prête
                video.onloadedmetadata = async () => {
                    overlay.style.display = 'none';
                    ui.style.display = 'block';
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    document.getElementById('statusInit').innerText = "Chargement du modèle IA...";
                    
                    // Chargement BlazeFace
                    model = await blazeface.load();
                    document.getElementById('statusInit').innerText = "Prêt ! Bougez la tête vite.";
                    
                    // Calibration DPI auto simple
                    const dpr = window.devicePixelRatio || 1;
                    screenDPI = dpr > 2 ? 450 : (dpr > 1 ? 300 : 150);
                    
                    loop();
                };

            } catch (err) {
                document.getElementById('errorMsg').innerText = "Erreur Caméra : " + err.message;
            }
        }

        // 2. Boucle principale
        async function loop() {
            if (!model) return;

            // Détection visage
            const predictions = await model.estimateFaces(video, false);

            if (predictions.length > 0) {
                const face = predictions[0];
                
                // Calcul position tête (Yaw approximatif via landmarks)
                // Landmark 0: Oeil gauche, 1: Oeil droit, 2: Nez
                const leftEye = face.landmarks[0];
                const rightEye = face.landmarks[1];
                const nose = face.landmarks[2];
                
                // Centre des yeux
                const eyeCenterX = (leftEye[0] + rightEye[0]) / 2;
                const eyeCenterY = (leftEye[1] + rightEye[1]) / 2;
                
                // Distance nez <-> yeux (pour estimation distance caméra)
                // Plus cette valeur est petite, plus on est loin
                const distPixels = Math.sqrt(Math.pow(nose[0]-eyeCenterX, 2) + Math.pow(nose[1]-eyeCenterY, 2));
                // Formule empirique: distance cm = k / distPixels
                distance = Math.max(30, Math.min(100, 3000 / (distPixels + 1))); 

                // Calcul Vitesse (Changement de position du nez entre 2 frames)
                const now = performance.now();
                if (lastHeadPos && (now - lastTime) > 30) {
                    const deltaX = Math.abs(nose[0] - lastHeadPos.x);
                    const deltaY = Math.abs(nose[1] - lastHeadPos.y);
                    const deltaT = (now - lastTime) / 1000; // secondes
                    
                    // Vitesse en pixels/seconde convertie arbitrairement en "degrés/sec" pour l'UI
                    // (C'est une approximation, mais suffisante pour le déclenchement)
                    speed = (deltaX + deltaY) / deltaT * 0.5; 
                }

                lastHeadPos = { x: nose[0], y: nose[1] };
                lastTime = now;

                // Gestion de l'état
                handleState(speed, now);

                // Affichage Stats
                document.getElementById('statusSpeed').innerText = `Vitesse: ${Math.round(speed)} (Seuil: 150)`;
                document.getElementById('statusDist').innerText = `Distance: ~${Math.round(distance)} cm`;
                
                // Calcul taille lettre en direct pour info
                const sizeInfo = calculateSize(distance, acuity);
                document.getElementById('statusSize').innerText = `Taille: ${Math.round(sizeInfo)} px`;

            } else {
                document.getElementById('statusSpeed').innerText = "Aucun visage détecté";
            }

            requestAnimationFrame(loop);
        }

        // 3. Machine d'état pour l'affichage
        function handleState(currentSpeed, now) {
            const minSpeedTrigger = 150;
            const minSpeedStop = 40;
            const flashDuration = 60; // ms
            const cooldownDuration = 1000; // ms

            if (state === 'IDLE') {
                if (currentSpeed > minSpeedTrigger && (now - lastFlashTime > cooldownDuration)) {
                    // DÉCLENCHEMENT
                    state = 'FLASH';
                    lastFlashTime = now;
                    
                    // Afficher lettre
                    const randomLetter = letters[Math.floor(Math.random() * letters.length)];
                    letterEl.innerText = randomLetter;
                    letterEl.style.fontSize = calculateSize(distance, acuity) + 'px';
                    letterEl.style.opacity = '1';

                    // Masquer après 60ms
                    setTimeout(() => {
                        letterEl.style.opacity = '0';
                        state = 'COOLDOWN';
                    }, flashDuration);
                }
            } else if (state === 'COOLDOWN') {
                // On attend que la vitesse retombe pour réarmer (IDLE)
                if (currentSpeed < minSpeedStop) {
                    state = 'IDLE';
                }
            }
        }

        // 4. Calcul Optométrique
        function calculateSize(distCm, acuityDecimal) {
            // Acuité 1.0 (10/10) = lettre sous-tendant 5 minutes d'arc à la distance donnée
            // 1 minute d'arc = 1/60 degré
            // Taille (mm) = 2 * Distance (mm) * tan( (5/60 / 2) * PI/180 ) / acuity
            
            // Simplifié : Taille(cm) = Distance(cm) * 0.0145 / acuité
            // 0.0145 vient de tan(5/60 deg) * 2 approx
            
            let heightCm = (distCm * 0.0145) / acuityDecimal;
            
            // Conversion en Pixels : (CM / 2.54) * DPI
            let heightPx = (heightCm / 2.54) * screenDPI;
            
            return Math.max(20, heightPx); // Minimum 20px pour lisibilité
        }

        function updateParams() {
            acuity = parseFloat(document.getElementById('acuity').value);
            document.getElementById('valAcuity').innerText = acuity.toFixed(1);
        }
    </script>
</body>
</html>
